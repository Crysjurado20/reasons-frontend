<div class="flex h-screen bg-gray-50 font-merriweather overflow-hidden">

  <!-- Mobile Overlay -->
  <div *ngIf="sidebarOpen()"
       class="fixed inset-0 bg-black/50 z-30 md:hidden"
       (click)="closeSidebar()">
  </div>

  <!-- Sidebar -->
  <aside id="dashboard-sidebar"
         class="fixed md:relative inset-y-0 left-0 z-40 w-64 bg-primary text-white shadow-xl flex flex-col transition-transform duration-300 ease-in-out"
         [style.transform]="sidebarOpen() || isDesktop() ? 'translateX(0)' : 'translateX(-100%)'">
    
    <div class="h-16 flex items-center justify-between border-b border-white/10 px-4">
      <div class="flex items-center space-x-2">
        <img src="assets/logo.svg" alt="Logo" class="w-8 h-8">
        <h2 class="text-2xl font-bold tracking-wider">REAS<span class="text-white/50">ONS</span></h2>
      </div>
      <!-- Close button (mobile only) -->
      <button (click)="closeSidebar()" class="md:hidden text-white/70 hover:text-white p-1">
        <span class="material-icons">close</span>
      </button>
    </div>
    
    <div class="p-4 flex-1">
      <div class="mb-6 text-sm text-white/50 uppercase tracking-wider font-semibold">Menú</div>
      <nav class="space-y-2">
        <a routerLink="/dashboard/researchers" routerLinkActive="bg-white/10 border-l-4 border-secondary text-white"
           (click)="closeSidebar()"
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white/80 hover:bg-white/10 hover:text-white transition-all border-l-4 border-transparent">
          <span class="material-icons">groups</span>
          <span>Investigadores</span>
        </a>
        <a routerLink="/dashboard/projects" routerLinkActive="bg-white/10 border-l-4 border-secondary text-white"
           (click)="closeSidebar()"
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white/80 hover:bg-white/10 hover:text-white transition-all border-l-4 border-transparent">
          <span class="material-icons">lightbulb</span>
          <span>Proyectos</span>
        </a>
        <a routerLink="/dashboard/publications" routerLinkActive="bg-white/10 border-l-4 border-secondary text-white"
           (click)="closeSidebar()"
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white/80 hover:bg-white/10 hover:text-white transition-all border-l-4 border-transparent">
          <span class="material-icons">article</span>
          <span>Publicaciones</span>
        </a>
        <a routerLink="/dashboard/settings" routerLinkActive="bg-white/10 border-l-4 border-secondary text-white"
           (click)="closeSidebar()"
           class="flex items-center space-x-3 px-4 py-3 rounded-lg text-white/80 hover:bg-white/10 hover:text-white transition-all border-l-4 border-transparent">
          <span class="material-icons">settings</span>
          <span>Ajustes</span>
        </a>
      </nav>
    </div>

    <!-- User Profile -->
    <div class="p-4 border-t border-white/10 bg-black/10">
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 flex-shrink-0 rounded-full bg-secondary flex items-center justify-center text-primary font-bold">
          {{ user?.name?.charAt(0) || 'A' }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">{{ user?.name || 'Admin' }}</p>
          <p class="text-xs text-white/50 truncate">{{ user?.email || 'admin@reasons.ec' }}</p>
        </div>
        <button (click)="logout()" class="text-white/50 hover:text-red-400 transition-colors p-2 flex-shrink-0" title="Cerrar Sesión">
          <span class="material-icons">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden relative min-w-0">
    <!-- Top Header -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shadow-sm z-10 flex-shrink-0">
      <!-- Hamburger for mobile -->
      <button (click)="toggleSidebar()" class="md:hidden p-2 rounded-lg text-primary hover:bg-gray-100 transition-colors mr-3">
        <span class="material-icons">menu</span>
      </button>
      <h1 class="text-base md:text-xl font-semibold text-gray-800 truncate">Panel de Administración</h1>
    </header>

    <!-- Dynamic Content -->
    <div class="flex-1 overflow-auto p-4 md:p-8 bg-gray-50/50">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
