<div class="min-h-screen flex flex-col md:flex-row bg-background w-full">
  
  <!-- Left Side: Decorative / Brand -->
  <div class="hidden md:flex md:w-1/2 relative overflow-hidden bg-primary items-center justify-center p-12">
    <!-- Animated Background Elements -->
    <div class="absolute inset-0 bg-pattern-dots opacity-20"></div>
    <div class="animate-blob absolute -top-20 -left-20 w-96 h-96 bg-secondary/30 rounded-full blur-3xl mix-blend-screen"></div>
    <div class="animate-blob absolute -bottom-20 -right-20 w-[500px] h-[500px] bg-blue-500/20 rounded-full blur-3xl mix-blend-screen" style="animation-delay: 2s;"></div>
    
    <div class="relative z-10 w-full max-w-md flex flex-col items-center text-center space-y-8" appAnimateOnScroll animationName="animate-zoom-in">
      <img src="assets/logo.svg" alt="REASONS Logo" class="w-32 h-32 drop-shadow-2xl hover:scale-110 transition-transform duration-500">
      
      <div class="bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-3xl shadow-2xl">
        <h2 class="text-3xl font-merriweather font-bold text-white mb-4">Portal Administrativo</h2>
        <p class="text-primary-foreground/80 font-light leading-relaxed">
          Acceso exclusivo para investigadores y gestores de contenido del grupo REASONS. 
        </p>
      </div>

      <!-- Floating Image from Docs -->
      <div class="absolute -right-12 top-10 w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-2xl animate-float">
        <img src="assets/images/image1.jpeg" class="w-full h-full object-cover" alt="Investigador">
      </div>
      <div class="absolute -left-12 bottom-10 w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-2xl animate-float" style="animation-delay: 1.5s;">
        <img src="assets/images/image2.jpeg" class="w-full h-full object-cover" alt="Laboratorio">
      </div>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-12 bg-card relative">
    <div class="w-full max-w-md space-y-8" appAnimateOnScroll animationName="animate-fade-in-up" animationDelay="100ms">
      
      <div class="text-center md:text-left space-y-2">
        <h1 class="text-3xl font-bold font-merriweather text-primary">Bienvenido de nuevo</h1>
        <p class="text-muted-foreground">Ingresa tus credenciales para continuar.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6 mt-8">
        
        <!-- Error Alert is now handled globally via AlertService -->        <div class="space-y-4">
          <div class="space-y-2 group">
            <label for="email" class="text-sm font-bold text-foreground">Correo Electrónico</label>
            <div class="relative">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground group-focus-within:text-secondary transition-colors">mail</span>
              <input id="email" type="email" formControlName="email" class="pl-10 flex h-12 w-full rounded-xl border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-2 transition-all shadow-sm" placeholder="admin@reasons.edu.ec">
            </div>
            <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-xs font-medium text-destructive pl-1">Ingresa un correo electrónico válido.</p>
          </div>

          <div class="space-y-2 group">
            <div class="flex justify-between items-center">
              <label for="password" class="text-sm font-bold text-foreground">Contraseña</label>
              <a routerLink="/forgot-password" class="text-xs font-semibold text-primary hover:text-secondary transition-colors">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative">
              <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground group-focus-within:text-secondary transition-colors">lock</span>
              <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" class="pl-10 pr-10 flex h-12 w-full rounded-xl border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-2 transition-all shadow-sm" placeholder="••••••••">
              <button type="button" (click)="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-secondary focus:outline-none transition-colors">
                <span class="material-icons text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
            <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-xs font-medium text-destructive pl-1">La contraseña debe tener al menos 6 caracteres.</p>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <input type="checkbox" id="remember" formControlName="remember" class="h-4 w-4 rounded border-input text-secondary focus:ring-secondary">
          <label for="remember" class="text-sm font-medium leading-none text-muted-foreground peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Mantener sesión iniciada
          </label>
        </div>

        <button type="submit" [disabled]="isSubmitting" class="w-full h-12 flex items-center justify-center rounded-xl bg-primary text-white font-bold tracking-wide shadow-md hover:bg-primary/90 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all disabled:opacity-70 disabled:cursor-not-allowed">
          <span *ngIf="isSubmitting" class="material-icons animate-spin mr-2 text-sm">refresh</span>
          {{ isSubmitting ? 'Verificando...' : 'Iniciar Sesión' }}
        </button>

      </form>
    </div>
  </div>
</div>
