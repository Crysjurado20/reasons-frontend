<div class="min-h-screen bg-background py-12 md:py-24">
  <div class="container px-4 max-w-7xl mx-auto">
    <div appAnimateOnScroll animationName="animate-fade-in-up" class="flex flex-col space-y-4 mb-12">
      <h1 class="text-4xl font-bold tracking-tighter sm:text-5xl md:text-6xl font-merriweather text-primary">Artículos Científicos</h1>
      <p class="max-w-[700px] text-muted-foreground md:text-xl font-light">
        Publicaciones y contribuciones académicas recientes de los miembros de REASONS.
      </p>
    </div>
    
    <div class="space-y-6">
      <div *ngFor="let article of articles; let i = index" appAnimateOnScroll animationName="animate-fade-in-up" [animationDelay]="i * 150 + 'ms'" class="rounded-2xl border border-border bg-card text-card-foreground shadow-sm flex flex-col md:flex-row overflow-hidden hover:shadow-lg hover:border-primary/50 transition-all duration-300 group">
        <div class="w-full md:w-64 bg-primary/5 border-b md:border-b-0 md:border-r border-border flex flex-col items-center justify-center p-8 transition-colors group-hover:bg-primary/10">
          <span class="material-icons text-7xl text-primary/30 group-hover:text-primary transition-colors duration-300 mb-4">auto_stories</span>
          <span class="text-xs font-bold text-primary tracking-widest uppercase">Publicación</span>
        </div>
        <div class="p-6 md:p-8 flex-1 flex flex-col">
          <h3 class="font-bold text-2xl font-merriweather text-primary mb-3 leading-tight">{{ article.title }}</h3>
          <p class="text-sm font-medium text-foreground mb-4">{{ article.authors }}</p>
          <p class="text-muted-foreground mb-6 flex-grow leading-relaxed">
            {{ article.abstract }}
          </p>
          <div class="bg-secondary/5 border-l-4 border-secondary p-4 rounded-r-md mb-6 text-sm font-mono text-muted-foreground">
            {{ article.citation }}
          </div>
          <div class="mt-auto pt-4 border-t border-border">
            <a [href]="article.link" target="_blank" class="inline-flex items-center justify-center text-sm font-bold text-primary hover:text-secondary transition-colors gap-2 group/link">
              Leer publicación completa <span class="material-icons text-sm transition-transform group-hover/link:translate-x-1">arrow_forward</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
